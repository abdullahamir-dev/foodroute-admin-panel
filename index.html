<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodRoute | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-['Inter']">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-800/50 backdrop-blur-md border-r border-slate-700 p-6 flex flex-col">
            <div class="mb-10">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                    FoodRoute Admin
                </h1>
                <p class="text-xs text-slate-400 mt-1">Management Console</p>
            </div>
            
            <nav class="flex-1">
                <ul class="space-y-2">
                    <li>
                        <a href="index.html" class="flex items-center p-3 text-emerald-400 bg-emerald-400/10 rounded-lg">
                            <span class="mr-3 text-xl">📊</span> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="recipes.html" class="flex items-center p-3 text-slate-400 hover:bg-slate-700/50 rounded-lg transition">
                            <span class="mr-3 text-xl">🍲</span> Add Recipe
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="mt-auto pt-6 border-t border-slate-700 text-xs text-slate-500 text-center">
                v1.0.0 | Connected to Firestore
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-bold">Overview</h2>
                <div class="flex items-center space-x-4">
                    <span class="flex items-center px-3 py-1 bg-slate-800 rounded-full text-xs text-emerald-400">
                        <span class="w-2 h-2 bg-emerald-400 rounded-full mr-2 animate-pulse"></span> Live System
                    </span>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="stat-card group">
                    <div class="flex justify-between">
                        <h3 class="text-slate-400 font-semibold uppercase tracking-wider text-sm">Total Users</h3>
                        <span class="text-blue-500 text-2xl">👥</span>
                    </div>
                    <p id="total-users" class="text-4xl font-bold mt-4">---</p>
                    <div class="h-1 w-full bg-blue-500/20 mt-4 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-500 w-2/3"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="flex justify-between">
                        <h3 class="text-slate-400 font-semibold uppercase tracking-wider text-sm">Active Subscribers</h3>
                        <span class="text-emerald-500 text-2xl">💎</span>
                    </div>
                    <p id="active-subs" class="text-4xl font-bold mt-4">---</p>
                    <div class="h-1 w-full bg-emerald-500/20 mt-4 rounded-full overflow-hidden">
                        <div class="h-full bg-emerald-500 w-1/2"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="flex justify-between">
                        <h3 class="text-slate-400 font-semibold uppercase tracking-wider text-sm">Non-Subscribers</h3>
                        <span class="text-rose-500 text-2xl">⌛</span>
                    </div>
                    <p id="inactive-subs" class="text-4xl font-bold mt-4">---</p>
                    <div class="h-1 w-full bg-rose-500/20 mt-4 rounded-full overflow-hidden">
                        <div class="h-full bg-rose-500 w-1/4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
