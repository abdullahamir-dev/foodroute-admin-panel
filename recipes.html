<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FoodRoute | Add Recipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#0f172a] text-slate-100 font-['Inter']">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-slate-800/50 backdrop-blur-md border-r border-slate-700 p-6 flex flex-col">
            <div class="mb-10"><h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">FoodRoute Admin</h1></div>
            <nav class="flex-1">
                <ul class="space-y-2">
                    <li><a href="index.html" class="flex items-center p-3 text-slate-400 hover:bg-slate-700/50 rounded-lg">📊 Dashboard</a></li>
                    <li><a href="recipes.html" class="flex items-center p-3 text-emerald-400 bg-emerald-400/10 rounded-lg">🍲 Add Recipe</a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 overflow-y-auto p-8 animate-page">
            <header class="mb-8"><h2 class="text-3xl font-bold">New Recipe</h2></header>

            <div class="stat-card max-w-4xl mx-auto">
                <form id="recipeForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="md:col-span-2">
                            <label class="label-style">Recipe Title</label>
                            <input type="text" id="title" class="input-style w-full" required>
                        </div>
                        
                        <div>
                            <label class="label-style">Cooking Time (minutes)</label>
                            <input type="number" id="cooking_time" class="input-style w-full" placeholder="e.g. 20" required>
                        </div>
                        <div>
                            <label class="label-style">Category</label>
                            <input type="text" id="category" class="input-style w-full" placeholder="Breakfast">
                        </div>

                        <div class="md:col-span-2">
                            <label class="label-style">Recipe Image</label>
                            <div class="flex items-center justify-center w-full">
                                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-700 rounded-xl cursor-pointer bg-slate-900/50 hover:bg-slate-800 transition">
                                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                        <p class="text-sm text-slate-400" id="file-status">Click to upload image</p>
                                    </div>
                                    <input type="file" id="image_file" class="hidden" accept="image/*" required />
                                </label>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-4 md:col-span-2">
                            <div><label class="label-style text-xs">Kcal</label><input type="number" id="calories" class="input-style w-full"></div>
                            <div><label class="label-style text-xs">Protein</label><input type="number" id="protein" class="input-style w-full"></div>
                            <div><label class="label-style text-xs">Carbs</label><input type="number" id="carbs" class="input-style w-full"></div>
                            <div><label class="label-style text-xs">Fat</label><input type="number" id="fat" class="input-style w-full"></div>
                        </div>

                        <div class="md:col-span-2">
                            <label class="label-style">Ingredients (Comma separated)</label>
                            <textarea id="ingredients" class="input-style w-full h-24"></textarea>
                        </div>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary w-full py-4">🚀 Sync to Firestore</button>
                </form>
            </div>
        </main>
    </div>
    <script type="module" src="js/firestore.js"></script>
</body>
</html>
